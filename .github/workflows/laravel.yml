name: Application checks
on:
  pull_request:
    branches: [my-sports-app-demo-1, staging, main]
  push:
    branches: [my-sports-app-demo-1, staging, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require staging for releases
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_BRANCH" = "main" ]; then
            if [ "$HEAD_BRANCH" != "staging" ] || [ "$HEAD_REPO" != "$REPOSITORY" ]; then
              echo "Release PRs must come from this repository's staging branch."
              exit 1
            fi
          fi
  framework:
    name: Laravel checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Laravel application
        id: application
        run: |
          if [ -f composer.json ] && [ -f artisan ]; then
            echo "laravel=true" >> "$GITHUB_OUTPUT"
          else
            echo "laravel=false" >> "$GITHUB_OUTPUT"
            echo "Prototype baseline: PHP syntax checks apply."
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, curl, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Check prototype PHP syntax
        if: steps.application.outputs.laravel != 'true'
        run: git ls-files -z '*.php' | xargs -0 -r -n 1 php -l
      - uses: actions/setup-node@v4
        if: steps.application.outputs.laravel == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
        if: steps.application.outputs.laravel == 'true'
      - run: composer validate --strict
        if: steps.application.outputs.laravel == 'true'
      - run: composer check-platform-reqs
        if: steps.application.outputs.laravel == 'true'
      - run: cp .env.example .env
        if: steps.application.outputs.laravel == 'true'
      - run: php artisan key:generate
        if: steps.application.outputs.laravel == 'true'
      - run: php vendor/bin/pint --test
        if: steps.application.outputs.laravel == 'true'
      - run: npm ci
        if: steps.application.outputs.laravel == 'true'
      - run: npm run build
        if: steps.application.outputs.laravel == 'true'
      - run: php artisan test
        if: steps.application.outputs.laravel == 'true'
